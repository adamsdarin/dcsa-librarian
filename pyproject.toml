[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcsa-library-custodian"
version = "0.1.0"
description = "Independent integrity, parity, discovery, and intake service for a governed DCSA evidence library"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dcsa-custodian = "library_custodian.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

