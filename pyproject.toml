[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcsa-library-custodian"
version = "0.1.0"
description = "Model-agnostic discovery and intake framework for a governed DCSA evidence library"
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.1; platform_system == 'Windows'"]

[project.optional-dependencies]
# Only doha-acquire needs it: it drives the installed Chrome, so no browser download.
browser = ["playwright>=1.40"]

[project.scripts]
dcsa-custodian = "library_custodian.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
