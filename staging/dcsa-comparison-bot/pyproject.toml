[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcsa-comparison-bot"
version = "0.1.0"
description = "Model-agnostic edition and content comparison plane for a governed DCSA evidence library"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dcsa-comparison = "dcsa_comparison.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
