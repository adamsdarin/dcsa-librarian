# Adapter, not a source of truth. The cadence is declared in
# config/schedule.json; regenerate the cron lines below with:
#   python custodian.py schedule --render github-actions
name: Scheduled DCSA source scan

on:
  workflow_dispatch:
    inputs:
      job:
        description: Schedule job id to run
        required: false
        default: monthly-scan
  schedule:
    # monthly-scan: full sweep on the 1st, 09:00 America/New_York
    - cron: '0 14 1 * *'
    # voi-release-watch: 09:00/12:00/15:00 America/New_York across the month-end window
    - cron: '0 14,17,20 28-31,1-3 * *'

permissions:
  contents: write

# Snapshots are committed state. Overlapping runs would race the baseline.
concurrency:
  group: dcsa-scheduled-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Select the declared job for this trigger
        id: select
        run: |
          case "${{ github.event.schedule }}" in
            '0 14 1 * *')            job=monthly-scan ;;
            '0 14,17,20 28-31,1-3 * *') job=voi-release-watch ;;
            *)                       job="${{ inputs.job || 'monthly-scan' }}" ;;
          esac
          echo "job=$job" >> "$GITHUB_OUTPUT"
          echo "Running declared job: $job"

      - name: Scan
        id: scan
        run: |
          # The runner has no access to the DCSA Library, so --library is
          # omitted: this detects source-side change only. Manifest triage
          # happens where the library lives.
          set +e
          python custodian.py scheduled-scan --job "${{ steps.select.outputs.job }}" > summary.json
          code=$?
          set -e
          cat summary.json
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Report
        run: |
          {
            echo "### DCSA scan — ${{ steps.select.outputs.job }}"
            echo
            case "${{ steps.scan.outputs.code }}" in
              0) echo "No changes detected." ;;
              3) echo "**Changes detected.** Review the findings below, then triage against the library." ;;
              1) echo "**A source failed.** The scan is incomplete; the release window was left open." ;;
              *) echo "Unexpected exit ${{ steps.scan.outputs.code }}." ;;
            esac
            echo
            echo '```json'
            cat summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated baseline
        run: |
          # Snapshots and period markers are the baseline the next run compares
          # against. An ephemeral runner that does not commit them detects
          # nothing, ever.
          if [ -z "$(git status --porcelain state/)" ]; then
            echo "Baseline unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "Update scan baseline (${{ steps.select.outputs.job }})"
          git push

      - name: Fail the run when a source errored
        if: steps.scan.outputs.code == '1'
        run: exit 1
